[project]
name = "ai-subtitle"
version = "0.1.0"
description = "On-device AI subtitle generator with speaker diarization, powered by MLX (Qwen3-ASR) and CoreML (senko)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    # [aligner] pulls nagisa/soynlp: the forced aligner (word timestamps) is
    # required for every language this pipeline supports, including JA/KO.
    # [mic] pulls sounddevice for live microphone transcription.
    "mlx-qwen3-asr[aligner,mic]>=0.4.0",
    "senko>=0.1.0",
]

[project.scripts]
ai-subtitle = "ai_subtitle.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_subtitle"]
